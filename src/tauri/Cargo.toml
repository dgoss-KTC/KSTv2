[package]
name = "kst-tauri"
version = "0.1.0-alpha.1"
description = "KST v2 - Keytronic Scheduler's Toolbox desktop host"
authors = ["Keytronic"]
license = "MIT"
repository = ""
default-run = "kst-tauri"
edition = "2021"
rust-version = "1.77.2"

[package.metadata.bundle]
identifier = "com.keytronic.kst"
icon = ["icons/icon.ico"]
copyright = "Keytronic"

[lib]
name = "kst_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kst-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"], default-features = false }
log = "0.4"
